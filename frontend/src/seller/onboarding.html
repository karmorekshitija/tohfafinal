<!-- File: frontend/src/seller/onboarding.html | Role: Seller Application Status & Onboarding Gate -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Status | Seller Studio — Tohfa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/animations.css">
</head>
<body style="background:#FFF8E7; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--space-4);">
  <div class="card animate-scale-in" style="max-width:500px; width:100%; padding:var(--space-8); text-align:center;">
    <div id="statusIcon" style="font-size:48px; margin-bottom:var(--space-3);">⏳</div>
    <h1 id="statusTitle" class="text-display" style="font-size:var(--text-2xl); color:var(--color-primary); margin-bottom:var(--space-2);">
      Application Under Review
    </h1>
    <p id="statusMsg" class="text-body" style="color:var(--color-text-muted); margin-bottom:var(--space-6);">
      Thank you for applying to Tohfa Studio! Our curation team carefully reviews all handmade collections within 24-48 hours.
    </p>

    <div id="actionContainer">
      <a href="/buyer/home.html" class="btn btn-secondary">Explore Tohfa Marketplace</a>
    </div>
  </div>

  <script type="module">
    import { api } from '../js/api.js';
    import { requireAuth, authStorage } from '../js/auth.js';

    if (requireAuth()) {}

    function parseBool(val) {
      if (val === true || val === 1 || val === '1') return true;
      if (typeof val === 'string' && val.trim().toLowerCase() === 'true') return true;
      return false;
    }

    async function checkStatus() {
      const urlParams = new URLSearchParams(window.location.search);
      const isSuspendedUrl = urlParams.get('status') === 'suspended';

      if (isSuspendedUrl) {
        document.getElementById('statusIcon').textContent = '🔒';
        document.getElementById('statusTitle').textContent = 'Artisan Account Suspended';
        document.getElementById('statusMsg').textContent = 'Your artisan store is temporarily suspended by administrative review. If you believe this is an error, please contact our artisan support team.';
        document.getElementById('actionContainer').innerHTML = `<a href="mailto:tohfa126@gmail.com" class="btn btn-secondary">Contact Artisan Support</a>`;
      }

      try {
        const res = await api.get('/api/seller/application-status');
        const app = res?.data?.application || res?.data;

        const isApproved = parseBool(app?.is_approved);
        const isSuspended = app?.verification_status === 'suspended' || app?.is_active === false || app?.is_active === 'false' || app?.is_active === 0;
        const isRejected = !isApproved && (app?.verification_status === 'rejected' || Boolean(app?.rejection_reason));

        if (isSuspended) {
          const u = authStorage.getUser() || {};
          u.verification_status = 'suspended';
          u.is_active = false;
          authStorage.setUser(u);

          document.getElementById('statusIcon').textContent = '🔒';
          document.getElementById('statusTitle').textContent = 'Artisan Account Suspended';
          document.getElementById('statusMsg').textContent = 'Your artisan store is temporarily suspended by administrative review. If you believe this is an error, please contact our artisan support team.';
          document.getElementById('actionContainer').innerHTML = `<a href="mailto:tohfa126@gmail.com" class="btn btn-secondary">Contact Artisan Support</a>`;
        } else if (isApproved) {
          // Reconcile authoritative server approval into client storage
          const u = authStorage.getUser() || {};
          u.is_approved = true;
          u.verification_status = 'verified';
          u.is_active = true;
          authStorage.setUser(u);

          // Approved active sellers reach intended Studio destination without a recurring success-panel stop or redirect loop
          const returnTo = sessionStorage.getItem('tohfa_return_to') || './dashboard.html';
          sessionStorage.removeItem('tohfa_return_to');
          window.location.replace(returnTo);
        } else if (isRejected) {
          const u = authStorage.getUser() || {};
          u.is_approved = false;
          u.verification_status = 'rejected';
          authStorage.setUser(u);

          document.getElementById('statusIcon').textContent = '⚠️';
          document.getElementById('statusTitle').textContent = 'Application Update';
          document.getElementById('statusMsg').textContent = `Reason: ${app.rejection_reason || 'Application criteria not met'}. You may re-apply with updated details.`;
          document.getElementById('actionContainer').innerHTML = `<a href="/auth/signup-seller.html" class="btn btn-primary">Re-apply as Seller</a>`;
        } else {
          // Pending
          const u = authStorage.getUser() || {};
          u.is_approved = false;
          u.verification_status = 'pending_verification';
          authStorage.setUser(u);
        }
      } catch (err) {
        if (err?.response?.status === 401 || err?.status === 401) {
          authStorage.clear();
          window.location.replace('/auth/login.html');
          return;
        }
        console.error('Failed to fetch application status:', err);
      }
    }

    checkStatus();
  </script>
</body>
</html>
