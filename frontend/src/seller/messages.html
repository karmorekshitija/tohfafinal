<!-- File: frontend/src/seller/messages.html | Role: Seller Quotes & Inquiries Management -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes & Inquiries | Seller Studio — Tohfa</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/animations.css">
  <style>
    .seller-layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    @media (max-width: 900px) { .seller-layout { grid-template-columns: 1fr; } .seller-sidebar { display: none; } }
    .seller-main { padding: var(--space-8); background: var(--color-background); }
  </style>
</head>
<body>
  <div class="seller-layout">
    <aside class="seller-sidebar" id="sellerSidebar"></aside>

    <main class="seller-main">
      <h1 class="text-display" style="font-size:var(--text-2xl); color:var(--color-primary); margin-bottom:var(--space-1);">Custom Quotes & Inquiries</h1>
      <p class="text-small" style="color:var(--color-text-muted); margin-bottom:var(--space-4);">Review bespoke buyer requests and send binding quotes with WhatsApp notifications</p>

      <!-- Filter Tabs -->
      <div class="tabs" style="margin-bottom:var(--space-4);">
        <button class="tab-btn active" onclick="setTab('all', this)">All Requests</button>
        <button class="tab-btn" onclick="setTab('requested', this)">Pending Quotes</button>
        <button class="tab-btn" onclick="setTab('quoted', this)">Active Quotes</button>
        <button class="tab-btn" onclick="setTab('expired', this)">Expired Quotes ⏳</button>
      </div>

      <div class="card" style="padding:var(--space-4);">
        <div id="customRequestsList">
          <div class="skeleton skeleton--card" style="height:120px;"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script type="module">
    import { api } from '../js/api.js';
    import { initSellerShell } from '../js/sellerLayout.js';
    import { requireAuth, requireRole } from '../js/auth.js';
    import { formatPrice, formatDate, statusClass, statusLabel, showToast } from '../js/utils.js';

    if (requireAuth() && requireRole('seller')) {
      initSellerShell({ activeTab: 'messages' });
    }

    const listEl = document.getElementById('customRequestsList');
    let currentTab = 'all';
    let allRequests = [];

    window.setTab = (tab, btn) => {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderList();
    };

    async function load() {
      try {
        const res = await api.get('/api/customization/requests');
        allRequests = Array.isArray(res?.data) ? res.data : [];
        renderList();
      } catch (err) {
        listEl.innerHTML = `<p class="text-body">${err.message}</p>`;
      }
    }

    function renderList() {
      let filtered = allRequests;
      if (currentTab === 'requested') {
        filtered = allRequests.filter(r => r.status === 'requested');
      } else if (currentTab === 'quoted') {
        filtered = allRequests.filter(r => r.status === 'quoted');
      } else if (currentTab === 'expired') {
        filtered = allRequests.filter(r => r.status === 'expired' || (r.status === 'quoted' && new Date(r.quote_expires_at) < new Date()));
      }

      if (!filtered.length) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__icon">💬</div>
            <h3 class="empty-state__title">No ${currentTab === 'all' ? 'custom' : currentTab} requests found</h3>
            <p class="empty-state__body">Bespoke buyer inquiries and quotes will appear here.</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(r => {
        const isExpired = r.status === 'expired' || (r.status === 'quoted' && new Date(r.quote_expires_at) < new Date());
        
        return `
          <div class="card flex justify-between items-start" style="padding:var(--space-4); margin-bottom:var(--space-3); ${isExpired ? 'background:rgba(255,193,7,0.05); border-left:4px solid var(--color-warning);' : ''}">
            <div>
              <div class="flex items-center gap-2">
                <span class="badge ${isExpired ? 'badge-warning' : statusClass(r.status)}">${isExpired ? 'Expired' : statusLabel(r.status)}</span>
                <span class="text-xs" style="color:var(--color-text-muted);">${formatDate(r.created_at)}</span>
              </div>
              <h4 style="font-family:var(--font-display); font-size:var(--text-md); color:var(--color-primary); margin-top:var(--space-1);">${r.product_name || 'Bespoke Item'}</h4>
              <div class="text-small"><strong>Customer:</strong> ${r.buyer_name || 'Buyer'} (${r.buyer_phone || ''})</div>
              <div class="text-xs" style="color:var(--color-text-muted); margin-top:4px;">
                <strong>Requirements:</strong> ${JSON.stringify(r.requirements || {})}
              </div>
              ${r.budget ? `<div class="text-xs" style="color:var(--color-primary); margin-top:2px;">Target Budget: ₹${r.budget}</div>` : ''}
              ${r.quote_amount ? `
                <div class="text-price-sm" style="margin-top:var(--space-2);">
                  Your Quote: ${formatPrice(r.quote_amount)} (${r.quote_turnaround || 'Standard'})
                  ${r.quote_expires_at ? `<span class="text-xs" style="color:var(--color-text-muted); font-weight:normal; margin-left:6px;">• Expired: ${formatDate(r.quote_expires_at)}</span>` : ''}
                </div>
              ` : ''}
            </div>

            <div class="flex flex-col gap-2 items-end">
              ${r.status === 'requested' ? `
                <button onclick="openQuoteModal('${r.id}')" class="btn btn-sm btn-primary">Send Quote →</button>
              ` : ''}
              ${isExpired ? `
                <button onclick="openQuoteModal('${r.id}', ${r.quote_amount || ''}, '${r.quote_turnaround || ''}')" class="btn btn-sm btn-secondary">🔄 Resend Quote</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    window.openQuoteModal = (requestId, prevAmount = '', prevTurnaround = '') => {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal animate-scale-in">
          <div class="modal__header">
            <h3 class="modal__title">${prevAmount ? 'Resend / Revive Custom Quote 🎨' : 'Send Binding Custom Quote 🎨'}</h3>
            <button onclick="this.closest('.modal-overlay').remove()" class="modal__close">✕</button>
          </div>
          <form id="sendQuoteForm" class="flex flex-col gap-4">
            <div class="form-group">
              <label class="form-label">Quote Amount (₹ INR) *</label>
              <input type="number" name="quote_amount" class="form-input" placeholder="e.g. 1800" min="1" value="${prevAmount}" required>
            </div>
            <div class="form-group">
              <label class="form-label">Turnaround Time *</label>
              <input type="text" name="quote_turnaround" class="form-input" value="${prevTurnaround || '4-6 business days'}" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">${prevAmount ? 'Resend Quote (48h Validity) 🚀' : 'Send Quote & Alert Customer via WhatsApp'}</button>
          </form>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#sendQuoteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
          await api.post(`/api/customization/request/${requestId}/quote`, {
            quote_amount: Number(formData.get('quote_amount')),
            quote_turnaround: formData.get('quote_turnaround'),
          });
          showToast('Quote sent to customer with WhatsApp notification!', 'success');
          modal.remove();
          load();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    };

    load();
  </script>
</body>
</html>
