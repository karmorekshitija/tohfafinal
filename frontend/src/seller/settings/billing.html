<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport"/>
  <script type="module" src="/src/components/ReportWidget.js" defer></script>
  <script type="module" src="/src/components/ProtectedRoute.js"></script>
  <meta charset="utf-8"/>
  <meta name="robots" content="noindex, nofollow">
  <title>Billing & Payout Settings | Seller Studio | Tohfa</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
  <link rel="stylesheet" href="/src/responsive.css">

  <script type="module" src="/src/components/seller-components.js"></script>
  <script type="module" src="/src/utils/useSellerOnboardingStatus.js"></script>

  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #FFF8E7;
      color: #1C1C1A;
      min-height: 100vh;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Playfair Display', serif;
    }
    .font-mono {
      font-family: 'Space Mono', monospace;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .card-section {
      background: #FFF8E7;
      border: 1px solid rgba(40, 92, 58, 0.15);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 2px 14px rgba(20, 56, 31, 0.04);
    }
    @media (min-width: 640px) {
      .card-section {
        padding: 28px;
      }
    }
    .form-input {
      width: 100%;
      background-color: #FFF8E7;
      border: 1px solid rgba(40, 92, 58, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      min-height: 44px;
      font-size: 16px;
      color: #1C1C1A;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    @media (min-width: 640px) {
      .form-input {
        font-size: 14px;
        padding: 12px 16px;
      }
    }
    .form-input:focus {
      border-color: #14381F;
      box-shadow: 0 0 0 3px rgba(20, 56, 31, 0.12);
    }
    .tab-btn {
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      color: #587A5B;
      background: transparent;
      border: 1px solid rgba(40, 92, 58, 0.2);
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: #14381F;
      border-color: #14381F;
    }
    .tab-btn.active {
      background: #14381F;
      color: #FFF8E7;
      border-color: #14381F;
      box-shadow: 0 2px 8px rgba(20, 56, 31, 0.2);
    }
  </style>
  <script>
    (function redirectToConsolidatedProfile() {
      const storedAlert = sessionStorage.getItem('tohfa_flash_alert');
      if (storedAlert) {
        sessionStorage.setItem('tohfa_flash_message', storedAlert);
        sessionStorage.removeItem('tohfa_flash_alert');
      }
      const search = window.location.search || '';
      window.location.replace('/seller/profile.html' + search + '#billing-section');
    })();
  </script>
</head>
<body class="bg-[#FFF8E7] text-on-surface min-h-screen flex items-center justify-center p-6">
  <div class="text-center space-y-3">
    <p class="text-sm font-semibold text-[#14381F]">Redirecting to consolidated Settings &gt; Profile…</p>
    <a href="/seller/profile.html#billing-section" class="text-xs underline text-[#285C3A]">Click here if you are not redirected automatically</a>
  </div>
</body>
</html>
