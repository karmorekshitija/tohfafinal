<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
<script type="module" src="/src/components/AdminSidebar.js"></script>
<script type="module" src="/src/components/ReportWidget.js" defer></script>
<script type="module" src="/src/components/ProtectedRoute.js"></script>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Tohfa Admin - Our Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
    <style>
    .watermark-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      opacity: 0.05;
      background-image: url('/img/textures/pinstripe.png');
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-[#FFF8E7] text-text-default font-body-md min-h-screen overflow-x-hidden">
  <div class="watermark-overlay"></div>

  <!-- Shared Sidebar Component Injected Dynamically -->
  <aside data-sidebar="admin"></aside>

  <!-- Top Navigation Header -->
  <header class="fixed top-0 right-0 w-[calc(100%-256px)] h-[60px] bg-[#FFF8E7] border-b border-outline-variant flex justify-between items-center px-8 z-40">
    <h2 class="font-headline-md text-headline-md italic text-primary">Our Story</h2>
    <div class="flex items-center gap-6">
      <button id="logout-btn" class="text-on-surface-variant hover:text-primary transition-colors text-[14px] font-label-btn">Logout</button>
      <div class="h-8 w-8 rounded-full bg-secondary-container flex items-center justify-center text-primary font-bold text-xs">TA</div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="ml-64 pt-[60px] p-8 max-w-[1200px] mx-auto min-h-screen">
    <!-- Header Section -->
    <section class="mb-8 mt-4 flex justify-between items-end">
      <div>
        <h1 class="font-headline-lg text-headline-lg text-primary leading-tight">Artisan Spotlights</h1>
        <p class="font-serif italic text-text-muted">Feature artisan stories on the buyer-facing platform</p>
      </div>
      <button onclick="openSpotlightModal()" class="px-6 py-2.5 bg-[#14381F] hover:bg-[#2a4d38] text-white rounded-full font-label-btn text-xs font-bold transition-all shadow-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">add</span>
        <span>Feature New Seller</span>
      </button>
    </section>

    <!-- Grid of Spotlights -->
    <div id="spotlight-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loaded dynamically via JS -->
      <div class="col-span-full text-center text-text-muted py-12 text-sm">Loading artisan stories...</div>
    </div>
  </main>

  <!-- Modal for Creating/Editing Spotlight -->
  <div id="spotlight-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-[#FFF8E7] rounded-xl w-full max-w-lg p-8 mx-4 transform scale-95 transition-all duration-300 relative">
      <button onclick="closeSpotlightModal()" class="absolute top-4 right-4 text-text-muted hover:text-text-default">
        <span class="material-symbols-outlined text-[24px]">close</span>
      </button>

      <h3 id="modal-title" class="font-headline-lg text-xl italic text-primary mb-6">Feature Seller Spotlight</h3>
      
      <form id="spotlight-form" class="space-y-4">
        <!-- Seller selection row -->
        <div id="seller-select-section">
          <label class="block text-xs font-bold text-[#14381F] uppercase tracking-wider mb-2">Artisan Seller</label>
          <div class="flex gap-2">
            <input type="text" id="selected-seller-name" readonly placeholder="Click 'Select' to search sellers" class="flex-1 px-4 py-2 border border-outline-variant/40 rounded-xl text-sm bg-[#FFF8E7]/30 outline-none" required />
            <input type="hidden" id="selected-seller-id" />
            <button type="button" id="btn-search-seller" class="px-4 py-2 bg-[#FFF8E7] border border-outline-variant/30 text-primary rounded-xl text-xs font-bold hover:bg-[#14381F] hover:text-white transition-all">
              Select
            </button>
          </div>
        </div>

        <!-- Story Caption text -->
        <div>
          <label class="block text-xs font-bold text-[#14381F] uppercase tracking-wider mb-2">Artisan Story (Text)</label>
          <textarea id="spotlight-text" required rows="5" placeholder="Share the history, craftsmanship, and soul behind this artisan studio..." class="w-full px-4 py-2 border border-outline-variant/40 rounded-xl text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none resize-none"></textarea>
        </div>

        <!-- Image Upload -->
        <div>
          <label class="block text-xs font-bold text-[#14381F] uppercase tracking-wider mb-2">Spotlight Banner Cover</label>
          <div class="border border-outline-variant/40 rounded-xl overflow-hidden h-[120px] bg-[#FFF8E7] flex items-center justify-center relative mb-3">
            <img id="preview-spotlight-image" class="w-full h-full object-cover hidden" loading="lazy" />
            <span id="placeholder-spotlight-image" class="material-symbols-outlined text-3xl text-text-faint">image</span>
          </div>
          <input type="file" id="file-spotlight-image" accept="image/*" class="hidden" />
          <button type="button" onclick="document.getElementById('file-spotlight-image').click()" class="px-4 py-1.5 border border-primary text-primary hover:bg-[#14381F] hover:text-white rounded-full text-xs font-bold transition-all">
            Choose Cover Image
          </button>
        </div>

        <!-- Visibility Toggle -->
        <div class="flex items-center gap-2 pt-2">
          <input type="checkbox" id="spotlight-active" class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4" checked />
          <label for="spotlight-active" class="text-xs text-text-muted font-semibold">Mark Spotlight Active (Live immediately)</label>
        </div>

        <button type="submit" id="btn-submit-form" class="w-full mt-6 py-3 bg-[#14381F] hover:bg-[#2a4d38] text-white rounded-full text-sm font-bold shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer border-none flex items-center justify-center gap-2">
          <span>Save Spotlight</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Modal for Seller Selection -->
  <div id="seller-modal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-[#FFF8E7] rounded-xl w-full max-w-md p-6 mx-4 transform scale-95 transition-all duration-300">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-outline-variant/20">
        <h3 class="font-headline-md text-base text-primary">Search Artisan Sellers</h3>
        <button type="button" onclick="closeSellerModal()" class="text-text-muted hover:text-text-default">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>
      <div class="mb-4">
        <input type="text" id="modal-seller-search" placeholder="Search by name, email, or shop name..." class="w-full px-4 py-2 border border-outline-variant/40 rounded-xl text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none" />
      </div>
      <div class="max-h-60 overflow-y-auto space-y-2" id="modal-sellers-list">
        <!-- Populated via JS -->
      </div>
    </div>
  </div>

  <script type="module">
    import adminApiClient from '/src/utils/adminApiClient.js';

    let activeSpotlights = [];
    let editingId = null;

    async function loadSpotlights() {
      try {
        const res = await adminApiClient.get('/admin/our-story');
        if (res.data && res.data.success) {
          activeSpotlights = res.data.data;
          renderSpotlights();
        }
      } catch (err) {
        console.error('Failed to load Our Story spotlights:', err);
      }
    }

    function renderSpotlights() {
      const grid = document.getElementById('spotlight-grid');
      grid.innerHTML = '';
      if (activeSpotlights.length > 0) {
        activeSpotlights.forEach(s => {
          const sellerTitle = s.seller_name || s.name || 'Seller';
          const initial = sellerTitle.charAt(0).toUpperCase();
          const shopTitle = s.shop_name || s.store_name || 'Artisan Studio';
          const descriptionText = s.story_text || s.blurb || s.bio || 'Crafting timeless Indian keepsakes with passion and care.';
          const card = document.createElement('div');
          card.className = 'bg-[#FFF8E7] rounded-xl border border-outline-variant/30 overflow-hidden shadow-sm flex flex-col justify-between hover:shadow-md duration-200 transition-all';
          card.innerHTML = `
            <div>
              <div class="h-44 w-full bg-[#FFF8E7] overflow-hidden flex items-center justify-center border-b border-outline-variant/20 relative">
                ${s.image_url 
                  ? `<img src="${s.image_url}" class="w-full h-full object-cover" loading="lazy" />`
                  : `<span class="material-symbols-outlined text-4xl text-text-faint">image</span>`
                }
                <span class="absolute top-3 right-3 px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase ${s.is_active ? 'bg-[#f0f7ee] text-[#14381F] border border-[rgba(20,56,31,0.2)]' : 'bg-gray-100 text-gray-500 border border-gray-300'}">
                  ${s.is_active ? 'Active' : 'Inactive'}
                </span>
              </div>
              <div class="p-5">
                <div class="flex items-center gap-3 mb-3">
                  <div class="h-8 w-8 rounded-full bg-secondary-container flex items-center justify-center text-primary font-bold text-xs shrink-0">${initial}</div>
                  <div>
                    <h4 class="text-sm font-bold text-primary truncate leading-tight">${sellerTitle}</h4>
                    <p class="text-[10px] text-text-faint font-data-meta mt-0.5 truncate">${shopTitle}</p>
                  </div>
                </div>
                <p class="text-xs text-text-muted line-clamp-4 leading-relaxed">${descriptionText}</p>
              </div>
            </div>
            <div class="p-5 pt-0 border-t border-outline-variant/10 flex items-center justify-end gap-2 mt-4 bg-gray-50/50">
              <button onclick="editSpotlight('${s.id}')" class="px-4 py-1.5 border border-primary text-primary hover:bg-[#FFF8E7] rounded-full text-xs font-bold transition-all cursor-pointer">
                Edit
              </button>
              <button onclick="deleteSpotlight('${s.id}')" class="px-4 py-1.5 border border-error text-error hover:bg-[#FFF8E7] rounded-full text-xs font-bold transition-all cursor-pointer">
                Remove
              </button>
            </div>
          `;
          grid.appendChild(card);
        });
      } else {
        grid.innerHTML = `<div class="col-span-full text-center text-text-muted py-12 text-sm">No featured artisan spotlights yet</div>`;
      }
    }

    // Modal forms show/hide
    window.openSpotlightModal = function(id = null) {
      editingId = id;
      document.getElementById('spotlight-form').reset();
      
      const preview = document.getElementById('preview-spotlight-image');
      const placeholder = document.getElementById('placeholder-spotlight-image');
      preview.classList.add('hidden');
      placeholder.classList.remove('hidden');

      if (id !== null) {
        document.getElementById('modal-title').textContent = 'Edit Seller Spotlight';
        const s = activeSpotlights.find(item => String(item.id) === String(id));
        if (s) {
          document.getElementById('selected-seller-name').value = s.seller_name || s.name || '';
          document.getElementById('selected-seller-id').value = s.seller_id;
          document.getElementById('spotlight-text').value = s.story_text || s.blurb || s.bio || '';
          document.getElementById('spotlight-active').checked = !!s.is_active;

          if (s.image_url) {
            preview.src = s.image_url;
            preview.classList.remove('hidden');
            placeholder.classList.add('hidden');
          }
        }
      } else {
        document.getElementById('modal-title').textContent = 'Feature Seller Spotlight';
      }

      document.getElementById('spotlight-modal').classList.remove('pointer-events-none', 'opacity-0');
      document.getElementById('spotlight-modal').querySelector('.transform').classList.remove('scale-95');
      document.getElementById('spotlight-modal').querySelector('.transform').classList.add('scale-100');
    }

    window.closeSpotlightModal = function() {
      document.getElementById('spotlight-modal').classList.add('pointer-events-none', 'opacity-0');
      document.getElementById('spotlight-modal').querySelector('.transform').classList.remove('scale-100');
      document.getElementById('spotlight-modal').querySelector('.transform').classList.add('scale-95');
      editingId = null;
    }

    // Modal file uploads
    document.getElementById('file-spotlight-image').addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const url = URL.createObjectURL(e.target.files[0]);
        const preview = document.getElementById('preview-spotlight-image');
        preview.src = url;
        preview.classList.remove('hidden');
        document.getElementById('placeholder-spotlight-image').classList.add('hidden');
      }
    });

    // Form submissions
    document.getElementById('spotlight-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('btn-submit-form');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Saving...</span>';

      const sellerId = document.getElementById('selected-seller-id').value;
      const text = document.getElementById('spotlight-text').value;
      const fileInput = document.getElementById('file-spotlight-image');
      const active = document.getElementById('spotlight-active').checked;

      const formData = new FormData();
      formData.append('seller_id', sellerId);
      formData.append('story_text', text);
      formData.append('is_active', active ? '1' : '0');
      if (fileInput.files && fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
      }

      try {
        let res;
        if (editingId !== null) {
          res = await adminApiClient.put(`/admin/our-story/${editingId}`, formData, {
            headers: { 'Content-Type': 'multipart/form-data' }
          });
        } else {
          res = await adminApiClient.post(`/admin/our-story`, formData, {
            headers: { 'Content-Type': 'multipart/form-data' }
          });
        }

        if (res.data && res.data.success) {
          closeSpotlightModal();
          loadSpotlights();
        }
      } catch (err) {
        console.error(err);
        alert(err.response?.data?.message || 'Error occurred while saving spotlight.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Save Spotlight</span>';
      }
    });

    // Edit and remove handlers bound to window
    window.editSpotlight = function(id) {
      openSpotlightModal(id);
    };

    window.deleteSpotlight = async function(id) {
      if (!confirm('Are you sure you want to remove this featured seller story?')) return;
      try {
        const res = await adminApiClient.delete(`/admin/our-story/${id}`);
        if (res.data && res.data.success) {
          loadSpotlights();
        }
      } catch (err) {
        console.error(err);
      }
    };

    // Seller lookup modal handling
    const sellerModal = document.getElementById('seller-modal');
    document.getElementById('btn-search-seller').addEventListener('click', () => {
      sellerModal.classList.remove('pointer-events-none', 'opacity-0');
      sellerModal.querySelector('.transform').classList.remove('scale-95');
      sellerModal.querySelector('.transform').classList.add('scale-100');
      fetchModalSellers('');
    });

    window.closeSellerModal = function() {
      sellerModal.classList.add('pointer-events-none', 'opacity-0');
      sellerModal.querySelector('.transform').classList.remove('scale-100');
      sellerModal.querySelector('.transform').classList.add('scale-95');
    }

    async function fetchModalSellers(search = '') {
      try {
        const res = await adminApiClient.get(`/admin/sellers?search=${search}&per_page=15`);
        const listEl = document.getElementById('modal-sellers-list');
        listEl.innerHTML = '';
        if (res.data && res.data.success && res.data.data.sellers.length > 0) {
          res.data.data.sellers.forEach(s => {
            const div = document.createElement('div');
            div.className = 'flex items-center justify-between p-3 border border-outline-variant/20 rounded-lg hover:bg-[#FFF8E7]/40 cursor-pointer';
            div.addEventListener('click', () => selectSellerForSpotlight(s));
            div.innerHTML = `
              <div>
                <h4 class="text-sm font-semibold text-primary">${s.name}</h4>
                <p class="text-[10px] text-text-muted mt-0.5">${s.email} • ${s.shop_name || 'Artisan Shop'}</p>
              </div>
              <span class="material-symbols-outlined text-xs text-text-faint">chevron_right</span>
            `;
            listEl.appendChild(div);
          });
        } else {
          listEl.innerHTML = `<p class="text-xs text-text-muted py-4 text-center">No sellers found</p>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    function selectSellerForSpotlight(s) {
      document.getElementById('selected-seller-name').value = s.name;
      document.getElementById('selected-seller-id').value = s.id;
      closeSellerModal();
    }

    document.getElementById('modal-seller-search').addEventListener('input', (e) => {
      fetchModalSellers(e.target.value.trim());
    });

    // Logout Action
    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem('tohfa_admin_token');
      // admin login check bypassed
    });

    // Initial Load
    document.addEventListener('DOMContentLoaded', loadSpotlights);
  </script>
</body>
</html>
