<!DOCTYPE html>

      </a>
      <a

      <a

        class="p-1.5 sm:p-2 rounded-full text-[#FAF6EE] hover:bg-[#FAF6EE]/10 active:scale-95 transition-all flex items-center justify-center"

        class="p-1.5 sm:p-2 rounded-full text-[#FAF6EE] hover:bg-[#FAF6EE]/10 active:scale-95 transition-all flex items-center justify-center relative"

      <div id="auth-buttons-container" class="hidden md:flex items-center gap-2 ml-2 md:ml-4"></div>

              <div class="w-1/4 h-4 skeleton-detail rounded-full"></div>
              <div class="w-1/3 h-6 skeleton-detail rounded-full"></div>

          <!-- Card 5 -->

            <div class="aspect-[4/3] skeleton-base rounded-lg sm:rounded-xl"></div>
            <div class="w-1/3 h-2.5 skeleton-detail rounded-full"></div>

            <div class="flex justify-between items-center pt-1">
