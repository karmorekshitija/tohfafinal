<!--
  FILE: components/tohfa-navbar.html
  PANEL: Buyer Navigation Header (LOCKED)
  PURPOSE: Standardized responsive top navigation bar for all buyer pages.
  COLOR: #273328 (Dark gray green)
-->
<header
  class="w-full sticky top-0 z-50 border-b flex justify-between items-center px-3 sm:px-6 md:px-8 lg:px-12 h-14 md:h-20 transition-colors"
  style="background-color: #273328; background-image: url('/img/taskbar-texture.png'); background-repeat: repeat; background-size: auto; background-position: center; border-color: rgba(250,246,238,0.12);"
>
  <!-- Brand Logo -->
  <div class="flex items-center flex-shrink-0">
    <a
      href="/buyer/home.html"
      class="select-none"
      style="font-family: 'Playfair Display', serif; font-size: clamp(22px, 3.5vw, 32px); font-style: italic; color: #FAF6EE; text-decoration: none;"
    >
      Tohfa<span style="color: #FAF6EE; opacity: 0.7;">.</span>
    </a>
  </div>

  <!-- Desktop Navigation Links -->
  <nav class="hidden md:flex items-center justify-center gap-6 lg:gap-8 h-full">
    <a
      href="/buyer/home.html"
      id="nav-link-home"
      class="flex items-center gap-1.5 h-full px-1 font-['DM_Sans'] text-[15px] text-[#FAF6EE]/75 hover:text-[#FAF6EE] border-b-2 border-transparent transition-colors no-underline font-medium"
    >
      <span class="material-symbols-outlined text-[20px]">home</span>
      <span>Home</span>
    </a>
    <a
      href="/buyer/categories.html"
      id="nav-link-categories"
      class="flex items-center gap-1.5 h-full px-1 font-['DM_Sans'] text-[15px] text-[#FAF6EE]/75 hover:text-[#FAF6EE] border-b-2 border-transparent transition-colors no-underline font-medium"
    >
      <span class="material-symbols-outlined text-[20px]">category</span>
      <span>Category</span>
    </a>
    <a
      href="/buyer/bulk.html"
      id="nav-link-bulk"
      class="flex items-center gap-1.5 h-full px-1 font-['DM_Sans'] text-[15px] text-[#FAF6EE]/75 hover:text-[#FAF6EE] border-b-2 border-transparent transition-colors no-underline font-medium"
    >
      <span class="material-symbols-outlined text-[20px]">inventory_2</span>
      <span>Bulk Gifting</span>
    </a>
    <a
      href="/buyer/zip-gift.html"
      id="nav-link-zipgift"
      class="flex items-center gap-1.5 h-full px-1 font-['DM_Sans'] text-[15px] text-[#FAF6EE]/75 hover:text-[#FAF6EE] border-b-2 border-transparent transition-colors no-underline font-medium"
    >
      <span class="material-symbols-outlined text-[20px]">bolt</span>
      <span>ZipGift</span>
    </a>
    <a
      href="/buyer/profile.html"
      id="nav-link-profile"
      class="flex items-center gap-1.5 h-full px-1 font-['DM_Sans'] text-[15px] text-[#FAF6EE]/75 hover:text-[#FAF6EE] border-b-2 border-transparent transition-colors no-underline font-medium"
    >
      <span class="material-symbols-outlined text-[20px]">person</span>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Right side items -->
  <div class="flex items-center justify-end gap-1 sm:gap-2 flex-shrink-0">
    <!-- Search Button -->
    <a
      href="/buyer/search.html?focus=true"
      id="header-search-btn"
      class="p-1.5 sm:p-2 rounded-full text-[#FAF6EE] hover:bg-[#FAF6EE]/10 active:scale-95 transition-all flex items-center justify-center"
      title="Search"
    >
      <span class="material-symbols-outlined text-[20px] sm:text-[22px]">search</span>
    </a>

    <!-- Wishlist Button -->
    <a
      href="/buyer/wishlist.html"
      class="p-1.5 sm:p-2 rounded-full text-[#FAF6EE] hover:bg-[#FAF6EE]/10 active:scale-95 transition-all flex items-center justify-center relative"
      title="Wishlist"
    >
      <span class="material-symbols-outlined text-[20px] sm:text-[22px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
      <span id="nav-wishlist-badge" class="absolute -top-1 -right-1 bg-[#FAF6EE] text-[#273328] text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden shadow-sm">0</span>
    </a>

    <!-- Cart Button -->
    <a
      href="/buyer/cart.html"
      class="p-1.5 sm:p-2 rounded-full text-[#FAF6EE] hover:bg-[#FAF6EE]/10 active:scale-95 transition-all flex items-center justify-center relative"
      title="Shopping Cart"
    >
      <span class="material-symbols-outlined text-[20px] sm:text-[22px]">shopping_bag</span>
      <span id="nav-cart-badge" class="absolute -top-1 -right-1 bg-[#FAF6EE] text-[#273328] text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden shadow-sm">0</span>
    </a>

    <!-- Notifications Button -->
    <a
      href="/buyer/notifications.html"
      class="p-1.5 sm:p-2 rounded-full text-[#FAF6EE] hover:bg-[#FAF6EE]/10 active:scale-95 transition-all flex items-center justify-center relative"
      title="Notifications"
    >
      <span class="material-symbols-outlined text-[20px] sm:text-[22px]">notifications</span>
      <span id="nav-notifications-badge" class="absolute top-1 right-1 w-2 h-2 bg-[#C85A32] rounded-full hidden"></span>
      <span id="nav-notif-badge" class="absolute top-1 right-1 w-2 h-2 bg-[#C85A32] rounded-full hidden"></span>
    </a>

    <!-- Auth Container (Desktop Only) -->
    <div id="auth-buttons-container" class="hidden md:flex items-center gap-2 ml-2 md:ml-4">
      <a href="/auth/login.html" class="text-sm font-semibold text-[#FAF6EE] hover:text-white hover:underline no-underline" style="font-family: 'DM Sans', sans-serif;">Login</a>
      <a href="/auth/signup-buyer.html" class="text-[#14381F] text-sm font-semibold px-3.5 py-1.5 rounded-lg bg-[#FAF6EE] hover:bg-white transition-all no-underline shadow-sm" style="font-family: 'DM Sans', sans-serif;">Sign Up</a>
    </div>
  </div>
</header>
