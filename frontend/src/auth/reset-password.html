<!--
  FILE: auth/reset-password.html
  PANEL: Auth
  ROUTE: /auth/reset-password.html
  PURPOSE: Set a new account password using token verification.
  AUTH: Public (token required in query params)
  LAST_POLISHED: 2026-08-23
-->
<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Reset Password | Tohfa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
  <link rel="stylesheet" href="/src/responsive.css">
</head>
<body class="bg-[#FFF8E7] font-['DM_Sans'] text-[#1C1C1C] min-h-screen flex items-center justify-center p-4">

  <!-- Container -->
  <main class="w-full max-w-md">
    <div class="bg-[#FFF8E7] border border-[#14381F]/15 p-6 sm:p-8 rounded-2xl shadow-[0_8px_30px_rgba(20,56,31,0.06)]">
      <!-- Logo Section -->
      <header class="text-center mb-6">
        <a href="/buyer/home.html" class="font-['Playfair_Display'] text-3xl italic font-bold text-[#14381F] inline-block mb-1">
          Tohfa<span class="opacity-60">.</span>
        </a>
        <h1 class="font-['Playfair_Display'] text-2xl font-bold text-[#14381F] mb-1">Create New Password</h1>
        <p class="text-xs text-[#1C1C1C]/60">Enter a secure password for your account</p>
      </header>

      <!-- General Error Alert Banner -->
      <div id="general-error" class="hidden bg-[#C0392B]/10 border border-[#C0392B]/30 text-[#C0392B] p-4 rounded-xl mb-5 flex items-start gap-2.5">
        <span class="material-symbols-outlined text-[20px] text-[#C0392B] shrink-0 mt-0.5">warning</span>
        <p id="general-error-text" class="text-xs leading-relaxed font-medium"></p>
      </div>

      <!-- Success Alert Banner -->
      <div id="general-success" class="hidden bg-[#2D7A3A]/10 border border-[#2D7A3A]/30 text-[#2D7A3A] p-4 rounded-xl mb-5 flex items-start gap-2.5">
        <span class="material-symbols-outlined text-[20px] text-[#2D7A3A] shrink-0 mt-0.5">check_circle</span>
        <p id="general-success-text" class="text-xs leading-relaxed font-medium">Password successfully reset. You can now <a href="/auth/login.html" class="underline font-bold">sign in</a>.</p>
      </div>

      <!-- Reset Form -->
      <form class="space-y-4" id="reset-form">
        <div>
          <label class="block text-xs font-bold text-[#1C1C1C]/70 uppercase tracking-wider mb-1.5" for="password">New Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#1C1C1C]/40 text-[20px]">lock</span>
            <input class="w-full pl-10 pr-4 py-3 bg-[#FFF8E7] border border-[#14381F]/20 rounded-xl text-base text-[#1C1C1C] outline-none focus:border-[#14381F] focus:ring-2 focus:ring-[#14381F]/10 transition-all" id="password" name="password" placeholder="••••••••" required type="password"/>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-[#1C1C1C]/70 uppercase tracking-wider mb-1.5" for="confirm_password">Confirm Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#1C1C1C]/40 text-[20px]">lock</span>
            <input class="w-full pl-10 pr-4 py-3 bg-[#FFF8E7] border border-[#14381F]/20 rounded-xl text-base text-[#1C1C1C] outline-none focus:border-[#14381F] focus:ring-2 focus:ring-[#14381F]/10 transition-all" id="confirm_password" name="confirm_password" placeholder="••••••••" required type="password"/>
          </div>
        </div>

        <button class="w-full py-3.5 bg-[#14381F] text-[#FFF8E7] rounded-xl text-sm font-bold hover:bg-[#0D2614] active:scale-[0.99] transition-all shadow-sm mt-2" type="submit" id="submit-btn">
          Reset Password
        </button>
      </form>

      <footer class="mt-6 pt-5 border-t border-[#14381F]/10 text-center">
        <p class="text-xs text-[#1C1C1C]/70">
          <a class="text-[#14381F] font-bold hover:underline" href="/auth/login.html">Back to Sign In</a>
        </p>
      </footer>
    </div>
  </main>

  <script type="module">
    import apiClient from '/src/utils/apiClient.js';

    const resetForm = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm_password');
    const generalError = document.getElementById('general-error');
    const generalErrorText = document.getElementById('general-error-text');
    const generalSuccess = document.getElementById('general-success');

    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      generalErrorText.textContent = "Invalid password reset link. Please request a new one.";
      generalError.classList.remove('hidden');
      resetForm.classList.add('hidden');
    }

    resetForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      generalError.classList.add('hidden');

      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password !== confirmPassword) {
        generalErrorText.textContent = "Passwords do not match.";
        generalError.classList.remove('hidden');
        return;
      }

      if (password.length < 8) {
        generalErrorText.textContent = "Password must be at least 8 characters.";
        generalError.classList.remove('hidden');
        return;
      }

      submitBtn.innerText = 'Resetting...';
      submitBtn.disabled = true;

      try {
        const response = await apiClient.post('/auth/reset-password', {
          token,
          new_password: password
        });
        const data = response.data;

        if (data.success) {
          generalSuccess.classList.remove('hidden');
          resetForm.classList.add('hidden');
        } else {
          generalErrorText.textContent = data.message || "An unexpected error occurred.";
          generalError.classList.remove('hidden');
        }
      } catch (err) {
        console.error("Reset password request failed:", err);
        const response = err.response;
        if (response) {
          const data = response.data || {};
          if (response.status === 400) {
            generalErrorText.textContent = "This reset link has expired. Request a new one.";
          } else {
            generalErrorText.textContent = data.message || "An unexpected error occurred.";
          }
        } else {
          generalErrorText.textContent = "Unable to connect to the server. Please try again later.";
        }
        generalError.classList.remove('hidden');
      } finally {
        submitBtn.innerText = 'Reset Password';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
